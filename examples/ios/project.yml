name: MpcDemo
options:
  bundleIdPrefix: com.didenkolab.mpcsdk
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  MpcDemo:
    type: application
    platform: iOS
    sources: [MpcDemo]
    dependencies:
      - framework: Frameworks/MpcCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.didenkolab.mpcsdk.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MPC Demo
  MpcDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MpcDemoTests]
    dependencies:
      - target: MpcDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MpcDemo:
    build:
      targets:
        MpcDemo: all
        MpcDemoTests: [test]
    test:
      targets: [MpcDemoTests]
