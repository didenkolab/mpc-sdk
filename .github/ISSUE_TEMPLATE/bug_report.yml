name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** Use [private vulnerability reporting](../security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal code or commands. Never include real key shares.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - DKLs23 (ECDSA)
        - FROST (Ed25519)
        - Chain adapters (pkg/chain)
        - Go SDK (pkg/sdk, pkg/threshold)
        - iOS example / bindings
        - Android example / bindings
        - Build / tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Go and Rust versions, device / simulator
