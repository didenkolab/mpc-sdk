version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /internal/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /examples/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
