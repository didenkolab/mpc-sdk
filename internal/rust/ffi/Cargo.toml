[package]
name = "dkls23-ffi"
version = "1.0.0"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "mpc_dkls23_ffi"
# staticlib (.a) for mobile (iOS/Android) + cdylib (.so) for the Linux server
# build (Docker participant/guarantor links it dynamically, like frost-ffi).
# Integration tests live in src/ffi_tests (an rlib crate type would disable LTO).
crate-type = ["staticlib", "cdylib"]

[dependencies]
dkls23-ll = { path = "../core" }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.4"
derivation-path = "0.2.0"
hex = "0.4"
sl-mpc-mate = { workspace = true }

[dependencies.k256]
version = "0.13.2"
features = ["ecdsa", "serde"]
